<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packages tool</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--card:#f2f2f7;--ac:#0a84ff;--bd:#c7c7cc}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--card:#1c1c1e;--bd:#3a3a3c}}
body{font:15px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:820px;margin:0 auto;padding:16px}
section{background:var(--card);border-radius:14px;padding:16px;margin:16px 0}
h2{margin:0 0 10px;font-size:18px}label{display:block;margin:8px 0 3px;font-size:13px;opacity:.7}
input[type=text]{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
textarea{width:100%;box-sizing:border-box;min-height:260px;font:12px ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;margin:8px 8px 0 0;font-size:14px}
.m{font-size:13px;opacity:.75;margin-top:8px}.e{color:#ff453a}
button:hover {transform: scale(1.5);}
button:active {transform: scale(0.95);}
</style></head><body>
<h1>Packages tool</h1>

<section><h2>.deb → Packages</h2>
<input type="file" id="deb" accept=".deb" multiple>
<label>Filename prefix</label><input type="text" id="pre" value="pkgs/">
<label>Icon (URL/icon path)</label><input type="text" id="ico" placeholder="https://…/icon.png">
<label>Depiction (optionnel)</label><input type="text" id="dpt" placeholder="https://…/depiction">
<label>Sileodepiction (optionnel)</label><input type="text" id="dep" placeholder="https://…/depiction.json">
<button id="go">Generate</button><button id="cp">Copy</button><button id="dl">Download</button>
<div id="err" class="m e"></div>
<textarea id="out" spellcheck="false"></textarea></section>

<section><h2>Packages → .gz / .bz2 / .xz</h2>
<label>Packages file (text up there will be used if there's no file)</label><input type="file" id="pk">
<button data-f="gz">.gz</button><button data-f="bz2">.bz2</button><button data-f="xz">.xz</button><button data-f="all">both</button>
<div id="log" class="m"></div></section>
